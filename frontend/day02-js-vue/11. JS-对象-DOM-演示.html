<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-对象-DOM演示</title>
</head>

<body>
    <!-- 标题：通过 id="tb1" 给 JS 提供操作入口，演示"按 id 获取元素" -->
    <div style="font-size: 30px; text-align: center;" id="tb1">课程表</div>

    <!-- 表格：每行数据行都加了 class="data"，演示"按 class 获取元素" -->
    <table width="800px" border="1" cellspacing="0" align="center">
        <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>分数</th>
            <th>评语</th>
        </tr>
        <tr align="center" class="data">
            <td>001</td>
            <td>张三</td>
            <td>90</td>
            <td>很优秀</td>
        </tr>
        <tr align="center" class="data">
            <td>002</td>
            <td>李四</td>
            <td>92</td>
            <td>优秀</td>
        </tr>
        <tr align="center" class="data">
            <td>003</td>
            <td>王五</td>
            <td>83</td>
            <td>很努力,不错</td>
        </tr>
        <tr align="center" class="data">
            <td>004</td>
            <td>赵六</td>
            <td>98</td>
            <td>666</td>
        </tr>
    </table>
    <br>
    <!-- 按钮区：通过 onclick 绑定事件，点击时调用对应的 JS 函数 -->
    <div style="text-align: center;">
        <input id="b1" type="button" value="改变标题内容" onclick="fn1()">
        <input id="b2" type="button" value="改变标题颜色" onclick="fn2()">
        <input id="b3" type="button" value="删除最后一个" onclick="fn3()">
    </div>
</body>

<script>
    // fn1：通过 id 获取元素，修改其 innerHTML 内容
    function fn1(){
        // document.getElementById('tb1')：按 id 获取元素；innerHTML 属性用来读写元素内部的 HTML 内容
        document.getElementById('tb1').innerHTML="学员成绩表";
    }

    // fn2：通过 id 获取元素，修改其行内样式 style（覆盖原来的 style）
    function fn2(){
        // 直接把整个 style 字符串赋给元素，使标题文字颜色变为红色
        document.getElementById('tb1').style="font-size: 30px; text-align: center; color: red;"
    }

    // fn3：通过 class 获取元素集合，删除最后一个数据行
    function fn3(){
       // getElementsByClassName('data')：返回所有 class="data" 的元素数组（这里是 4 个 <tr> 数据行）
       var trs = document.getElementsByClassName('data');
       // trs.length-1 定位到最后一个数据行，remove() 将其从页面中删除
       trs[trs.length-1].remove();
    }
</script>

</html>
